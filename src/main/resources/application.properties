spring.application.name=prestamos
server.port=${PORT:8081}

# --- Supabase (PostgreSQL) · Session pooler, IPv4 ---
# Cada valor puede sobrescribirse con una variable de entorno (útil en Render/Docker).
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.thynjhahtodkwtplviqp}
spring.datasource.password=${DB_PASSWORD:juansupabase8054}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# "validate": las tablas las crea db/schema.sql; Hibernate solo comprueba que coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Swagger: http://localhost:8081/swagger-ui.html ---
springdoc.swagger-ui.path=/swagger-ui.html
